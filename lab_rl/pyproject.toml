[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c4rl"
version = "1.0.0"
description = "Connect-4 with reinforcement learning: AlphaZero-lite (batched MCTS) vs DQN, evaluated against a perfect solver"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c4rl = ["py.typed", "*.j2", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["c4rl"]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905"]  # Cyrillic strings are intentional
